<div class="stamp" [class.is-ready]="ready()">
  @if (status(); as result) {
    <app-stamp-result
      [status]="result"
      [stampCount]="stampCount()"
      [totalCount]="totalCount()"
      [remainingToReward]="remainingToReward()"
      (actionSelect)="onAction($event)"
    />
  } @else {
    <app-photo-capture
      [guide]="photoGuide()"
      [uploading]="isUploading()"
      (photoConfirm)="onPhotoConfirm($event)"
      (cancel)="onCaptureCancel()"
    />
  }
</div>
