<section class="dashboard" [class.is-ready]="ready()">
  <header class="dashboard-header">
    <h2>대시보드</h2>
    <button type="button" class="btn-text" (click)="logout()">로그아웃</button>
  </header>

  <div class="content">
    <div class="content-header">
      <h3>로그인 정보</h3>
    </div>

    <dl class="content-body info-list">
      <div>
        <dt>id</dt>
        <dd>{{ user()?.id ?? '(null)' }}</dd>
      </div>
      <div>
        <dt>email</dt>
        <dd>{{ user()?.email ?? '-' }}</dd>
      </div>
      <div>
        <dt>phone</dt>
        <dd>{{ user()?.phone ?? '-' }}</dd>
      </div>
      <div>
        <dt>method</dt>
        <dd>{{ user()?.method }}</dd>
      </div>
    </dl>
  </div>

  <div class="dashboard-actions">
    <button type="button" class="btn-primary" (click)="testApi()">
      API 테스트 (GET /api/auth/user)
    </button>

    @if (apiResult()) {
      <pre class="api-result">{{ apiResult() }}</pre>
    }
  </div>
</section>
