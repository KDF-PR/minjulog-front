<!-- 프레임(.contents-wrapper)은 app.html 이 이미 감싼다. 여기서 다시 감싸지 않는다. -->
<section class="main" [class.is-ready]="ready()">
  <div class="main-intro motion-fade-in">
    <p class="main-tagline">{{ tagline }}</p>
    <h1 class="main-wordmark">{{ wordmark }}</h1>
    <p class="main-subtitle">{{ subtitle }}</p>
    <p class="main-period">{{ periodLabel }}</p>
  </div>

  <!-- 메인 그래픽 자산 미수령 — 시안과 같은 문구 자리표시자 -->
  <figure class="main-graphic motion-fade-in motion-delay-1">
    <figcaption class="main-graphic-caption">메인 그래픽</figcaption>
  </figure>

  <p class="main-reward-note motion-fade-in motion-delay-2">
    스탬프를 모으면 선물이 하나씩 열려요
  </p>

  <div class="btn-container">
    <a class="is-primary" routerLink="/my-log">시작하기</a>
  </div>
</section>
