<section class="login" [class.is-ready]="ready()">
  <header class="login-header motion-fade-in">
    <h2 class="login-title">로그인</h2>
    <p class="login-desc">인증코드를 받아 시작하세요</p>
  </header>

  <div class="content motion-fade-in motion-delay-1">
    <div class="content-header">
      <p class="method-label" id="login-method-label">인증 방식</p>

      <!-- 두 방식 중 하나를 고르는 토글이라 radio 대신 aria-pressed 버튼을 쓴다 -->
      <div class="method" role="group" aria-labelledby="login-method-label">
        <button
          type="button"
          class="method-item"
          [class.is-active]="method() === 'email'"
          [attr.aria-pressed]="method() === 'email'"
          (click)="setMethod('email')"
        >
          이메일
        </button>
        <button
          type="button"
          class="method-item"
          [class.is-active]="method() === 'sms'"
          [attr.aria-pressed]="method() === 'sms'"
          (click)="setMethod('sms')"
        >
          문자
        </button>
      </div>
    </div>

    <!-- form 으로 감싸 모바일 키보드의 확인 키가 그대로 동작한다.
         기본 submit 은 페이지를 새로 불러오므로 먼저 막는다. -->
    <form class="content-body" (submit)="$event.preventDefault(); sendOtp(idRef.value)">
      <label class="field-label" for="login-identifier">
        {{ method() === 'email' ? '이메일' : '휴대폰 번호' }}
      </label>
      <input
        #idRef
        id="login-identifier"
        class="field-input"
        [type]="method() === 'email' ? 'email' : 'tel'"
        [attr.inputmode]="method() === 'email' ? 'email' : 'tel'"
        [attr.autocomplete]="method() === 'email' ? 'email' : 'tel'"
        [placeholder]="method() === 'email' ? 'you@example.com' : '010-1234-5678'"
        [attr.aria-invalid]="!!error()"
        [attr.aria-describedby]="error() ? 'login-error' : null"
      />

      @if (error()) {
        <p class="field-error" id="login-error" role="alert" animate.enter="motion-fade-enter">
          {{ error() }}
        </p>
      }

      <button
        type="submit"
        class="btn-primary"
        [class.is-loading]="loading()"
        [disabled]="loading()"
      >
        {{ loading() ? '전송 중...' : '인증코드 받기' }}
      </button>
    </form>
  </div>
</section>
