<div class="reward-notice">
  <div class="msg">
    <span class="icon-container" aria-hidden="true">
      <lazyLoadImg [src]="'/assets/images/ui/icons/gift'" />
    </span>
    <p>{{ title() }}</p>
  </div>

  <button type="button" (click)="linkSelect.emit()">
    {{ linkLabel() }}

    <span class="icon-container" aria-hidden="true">
      <lazyLoadImg [src]="'/assets/images/ui/icons/next'" />
    </span>
  </button>
</div>
