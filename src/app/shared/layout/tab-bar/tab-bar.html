<nav class="tab-bar" aria-label="주요 화면">
  <ul>
    @for (tab of tabs; track tab.path) {
      <li>
        <a
          [routerLink]="tab.path"
          routerLinkActive="is-active"
          #link="routerLinkActive"
          [attr.aria-current]="link.isActive ? 'page' : null"
        >
          {{ tab.label }}
        </a>
      </li>
    }
  </ul>
</nav>
