<section class="stamp-result">
  <div class="stamp-result-graphic">
    @if (view().mark) {
      <span class="stamp-result-mark" aria-hidden="true">{{ view().mark }}</span>
    }
  </div>

  <div class="stamp-result-body">
    <h2 class="stamp-result-title">{{ view().title }}</h2>

    @for (description of view().descriptions; track $index) {
      <p class="stamp-result-desc">{{ description }}</p>
    }

    @if (view().boxedDescription) {
      <p class="stamp-result-note">{{ view().boxedDescription }}</p>
    }
  </div>

  @if (view().showRewardCard) {
    <app-reward-notice
      class="stamp-result-notice"
      linkLabel="보러가기"
      (linkSelect)="actionSelect.emit('viewRewards')"
    />
  }

  <div class="stamp-result-actions">
    @for (item of view().actions; track item.action) {
      <button
        type="button"
        class="stamp-result-cta"
        [class.is-primary]="item.variant === 'primary'"
        (click)="actionSelect.emit(item.action)"
      >
        {{ item.label }}
      </button>
    }
  </div>
</section>
