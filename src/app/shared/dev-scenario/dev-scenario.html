<aside class="dev-scenario" [class.is-open]="open()">
  @if (open()) {
    <div class="dev-scenario-panel" role="group" aria-label="방문 시나리오 전환">
      @for (item of scenarios; track item) {
        <button
          type="button"
          class="dev-scenario-item"
          [class.is-active]="scenario() === item"
          (click)="select(item)"
        >
          {{ labels[item] }}
        </button>
      }
    </div>
  }

  <button type="button" class="dev-scenario-toggle" (click)="toggle()">
    {{ open() ? '닫기' : 'DEV' }}
  </button>
</aside>
