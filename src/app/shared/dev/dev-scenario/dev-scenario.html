<aside class="dev-scenario" [class.is-open]="open()">
  @if (open()) {
    <div role="group" aria-label="화면 상태 전환">
      <button type="button" [class.is-active]="!signedIn()" (click)="signOut()">
        로그인 전
      </button>

      @for (item of scenarios; track item) {
        <button
          type="button"
          [class.is-active]="signedIn() && scenario() === item"
          (click)="select(item)"
        >
          {{ labels[item] }}
        </button>
      }
    </div>
  }

  <button type="button" (click)="toggle()">
    {{ open() ? '닫기' : 'DEV' }}
  </button>
</aside>
