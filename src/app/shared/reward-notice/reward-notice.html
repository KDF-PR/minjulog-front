<div class="reward-notice">
  <!-- 선물 아이콘 자산 미수령 — 임시 SVG -->
  <span class="reward-notice-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <rect x="3" y="9" width="18" height="12" rx="1.5" />
      <path d="M3 13h18M12 9v12" />
      <path d="M12 9C10 9 7.5 8.4 7.5 6.2A2.2 2.2 0 0 1 12 6a2.2 2.2 0 0 1 4.5.2C16.5 8.4 14 9 12 9Z" />
    </svg>
  </span>

  <p class="reward-notice-title">{{ title() }}</p>

  <button type="button" class="reward-notice-link" (click)="linkSelect.emit()">
    {{ linkLabel() }} <span aria-hidden="true">›</span>
  </button>
</div>
